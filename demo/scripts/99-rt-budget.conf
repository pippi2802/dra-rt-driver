# 99-rt-budget.conf - configure RT/DEADLINE bandwidth for the H-CBS RT stack.
#
# VERIFIED on this HCBS kernel (re-confirmed on a clean boot): the per-cgroup RT
# budget (cpu.rt_runtime_us) can only be seeded when the global RT/DEADLINE
# admission control is OFF, i.e. kernel.sched_rt_runtime_us = -1 (RUNTIME_INF).
#
#   * A FINITE global runtime (e.g. 950000) leaves the admission check ON. Even on
#     a CLEAN boot with NO committed reservations, the cgroup-v2 root RT budget is
#     0 and un-writable under a finite global, so kubepods.slice/cpu.rt_runtime_us
#     is refused and every container's RT write EINVALs. (Confirmed empirically -
#     finite does not work even "early".)
#   * -1 bypasses the admission check, so root/kubepods/besteffort accept their
#     scalar 950000/1000000 budget and the chain can be seeded.
#
# SAFETY - READ THIS. -1 removes the kernel's global RT bandwidth reserve, so on
# its own it is DANGEROUS: a busy SCHED_FIFO/DEADLINE task can take 100% of a CPU
# and starve the kernel/kubelet/containerd -> the node hangs and RT pods become
# unkillable (observed). The REQUIRED mitigation is CPU ISOLATION at boot:
# reserve at least one housekeeping CPU that RT never runs on, via the kernel
# cmdline, e.g.  isolcpus=1-3 nohz_full=1-3 rcu_nocbs=1-3  (RT on cpu 1-3,
# housekeeping on cpu 0). Then the control plane always has CPU even under max RT
# load. Also: -1 cannot be restored to a finite value live (EBUSY once
# reservations exist) - reset with a reboot.
#
# After installing this drop-in run: sysctl --system  (then the rt-budget-seed
# service seeds root -> kubepods -> besteffort).

kernel.sched_rt_period_us = 1000000
kernel.sched_rt_runtime_us = -1

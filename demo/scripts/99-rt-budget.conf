# 99-rt-budget.conf - enable RT_GROUP_SCHED bandwidth for the H-CBS RT stack.
#
# The per-cgroup RT budget (cpu.rt_runtime_us) can only be written when global RT
# group bandwidth is ENABLED, i.e. the global runtime is a positive value
# STRICTLY LESS than the global period.
#
#   * kernel.sched_rt_runtime_us = -1        -> RUNTIME_INF: RT group bandwidth
#                                               DISABLED; every per-cgroup write
#                                               fails EINVAL. DO NOT USE.
#   * runtime == period (e.g. both 1000000)  -> effectively no headroom / the
#                                               per-core chain will not seed.
#   * 950000 < 1000000                       -> CORRECT: 95% RT budget per core,
#                                               5% reserved for non-RT progress.
#
# Install this drop-in and REMOVE any other sysctl entry that sets
# kernel.sched_rt_runtime_us = -1, then run: sysctl --system

kernel.sched_rt_period_us = 1000000
kernel.sched_rt_runtime_us = 950000

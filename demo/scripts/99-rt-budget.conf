# 99-rt-budget.conf - configure RT/DEADLINE bandwidth for the H-CBS RT stack.
#
# FINITE admission control (NO -1). Keeps the kernel's global RT/DEADLINE
# admission ON so experiments see real enforcement. The global stays at 100%
# (1000000/1000000); kubepods.slice, being non-root, is capped only by this
# global ratio, so a 95% cap is writable under it. On this HCBS kernel a separate
# CFS reserve is provided by the DEADLINE fair-server (per-CPU total_bw) at the
# root-domain level. sched_rt_runtime_us = -1 is deliberately avoided: it
# disables DL admission, removes the reserve, and would require CPU isolation to
# be safe.
#
# This matches Model A seeding: rt-budget-seed.sh caps kubepods.slice at 95%
# (950000/1000000) - the SAME threshold as the driver's admission control
# (Eq.1: Sum Qi/Pi <= 0.95) - and the fixed runc grows the per-QoS / per-pod /
# per-leaf RT budget on demand under that cap. A finite global is sufficient to
# seed the pod-cgroup subtree (verified: kubepods.slice/cpu.rt_runtime_us is
# writable under a finite global); only the cgroup-v2 ROOT file would need -1,
# and Model A never writes it.
#
# Verify the fair-server reserve on this node (total_bw non-zero):
#   sudo grep -iE 'dl_bw->bw|total_bw' /sys/kernel/debug/sched/debug | sort -u
# total_bw=0 here would mean NO CFS protection under RT load.
#
# After installing this drop-in run: sysctl --system  (then the rt-budget-seed
# service seeds kubepods.slice).

kernel.sched_rt_period_us = 1000000
kernel.sched_rt_runtime_us = 1000000

# 99-rt-budget.conf - configure RT/DEADLINE bandwidth for the H-CBS RT stack.
#
# VERIFIED on this HCBS 7.0.0 kernel: the per-cgroup RT budget (cpu.rt_runtime_us)
# can only be seeded when the global RT/DEADLINE admission control is OFF, i.e.
# kernel.sched_rt_runtime_us = -1 (RUNTIME_INF).
#
#   * A FINITE global runtime (e.g. 950000, or runtime==period 1000000) leaves the
#     admission check ON. The check then REFUSES the cgroup-v2 root
#     cpu.rt_runtime_us write (EBUSY / kernel log "tg_rt_schedulable ... dl check
#     tg"), so the root/kubepods/besteffort chain can never be seeded and every
#     container's RT write EINVALs.
#   * -1 bypasses the admission check. The root and parent slices then accept
#     their scalar 950000/1000000 budget, and the per-cgroup CBS/DEADLINE servers
#     built from cpu.rt_runtime_us still throttle each group. This is the setting
#     under which rt-verify and the model1 sweeps were validated.
#
# After installing this drop-in run: sysctl --system  (then the rt-budget-seed
# service seeds root -> kubepods -> besteffort).

kernel.sched_rt_period_us = 1000000
kernel.sched_rt_runtime_us = -1
